[package]
name = "apkworkshop"
version = "0.1.0"
description = "APK Workshop desktop app"
authors = ["liao"]
edition = "2021"

[lib]
name = "apkworkshop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
crc32fast = "1"
lz4_flex = "0.11"
png = "0.17"
pure_vorbis = { path = "vendor/pure_vorbis" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
texture2ddecoder = "0.1.2"
thiserror = "2"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
